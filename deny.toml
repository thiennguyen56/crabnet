[advisories]
version = 2
# `tun-rs` currently reaches this unmaintained crate through `netconfig-rs`.
# The latest compatible `tun-rs` release retains that dependency; revisit when
# its dependency graph no longer contains `paste`.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "transitive through tun-rs; RustSec reports no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# Crabnet is an unpublished learning prototype. Do not assign a license until
# the project owner selects one; third-party dependency licenses remain checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
