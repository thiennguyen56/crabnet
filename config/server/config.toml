log_level = "debug"

[mode]
type = "server"
bind_addr = "192.0.2.2:51821"

[tun]
name = "crabnet0"
address = "10.0.0.1"
prefix_len = 24
mtu = 1400

[routing]
server_routes = [
  { destination = "10.10.0.0/24", gateway = "172.16.0.2" }
]
enable_forwarding = true
enable_nat = true
nat_egress_interface = "cn-srv-back"

[security]
mode = "noise_ik"
private_key_path = "/etc/crabnet/client.key"

# server only
allowed_client_public_keys = ["<canonical encoded 32-byte key>"]
