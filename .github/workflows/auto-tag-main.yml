name: Tag master

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: auto-tag-master
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the next patch tag
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            current_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' Cargo.toml | head -n 1)"
            if [[ -z "${current_version}" ]]; then
              echo "Cargo.toml does not contain a semantic package version" >&2
              exit 1
            fi
            next_tag="v${current_version}"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          if git rev-parse --verify --quiet "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag ${next_tag} already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${next_tag}" --message "Release ${next_tag}" "${GITHUB_SHA}"
          git push origin "${next_tag}"
